# Pushes to main are checked only. A release tag (release-*) or a manual run
# checks again and then publishes an Android OTA update to the phone.
name: Check and publish

on:
  push:
    branches: [main]
    tags: ['release-*']
  workflow_dispatch:

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Generate typed routes
        run: CI=1 timeout 60 npx expo start --port 8090 > /dev/null 2>&1 || true
      - run: npm run check
      - run: TZ=Asia/Jerusalem npm run test:planning
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/release-') || github.event_name == 'workflow_dispatch'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli update --channel production --environment production --platform android --message "${{ github.ref_name }}" --non-interactive
